<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Talky</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Firebase SDK (modificar para no usar módulos) -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <style>
        /* Estilos personalizados */
        body {
            background-color: #f4f4f9;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: none;
        }
        h3, h5 {
            font-weight: bold;
            color: #333;
        }
        .forgot-password {
            font-size: 0.9rem;
            color: #007bff;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        button {
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4" style="max-width: 400px; width: 100%;">
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                <div class="text-center mt-3">
                    <a href="#" class="forgot-password" id="reset-password-link">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
            
            <hr>
            
            <h5 class="text-center mb-3">¿No tienes cuenta?</h5>
            <form id="register-form">
                <div class="mb-3">
                    <label for="register-email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="register-email" placeholder="Ingresa tu correo" required>
                </div>
                <div class="mb-3">
                    <label for="register-password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="register-password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script>        
        // Configuración de Firebase (asegúrate de tener tus credenciales correctas)
        const firebaseConfig = {
            apiKey: "AIzaSyBTPIwh0VxrQ8tWvujqtSitXKP2_dqg870",
            authDomain: "talky-3da8d.firebaseapp.com",
            projectId: "talky-3da8d",
            storageBucket: "gs://talky-3da8d.appspot.com",
            messagingSenderId: "200745711387",
            appId: "1:200745711387:web:62a650682031e00d3685be",
            measurementId: "G-BTJRWSG4H7"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Registro de nuevo usuario
        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert('Registro exitoso. Verifica tu correo para activar tu cuenta.');
                    user.sendEmailVerification();
                })
                .catch((error) => {
                    console.error(error);
                    alert('Error en el registro: ' + error.message);
                });
        });

        // Inicio de sesión
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    if (user.emailVerified) {
                        alert('Inicio de sesión exitoso.');
                    } else {
                        alert('Por favor verifica tu correo electrónico antes de iniciar sesión.');
                    }
                })
                .catch((error) => {
                    console.error(error);
                    alert('Error al iniciar sesión: ' + error.message.message);
                });
        });

        // Restablecer contraseña
        const resetPasswordLink = document.getElementById('reset-password-link');
        resetPasswordLink.addEventListener('click', () => {
            const email = prompt('Introduce tu correo electrónico:');
            if (email) {
                auth.sendPasswordResetEmail(email)
                    .then(() => {
                        alert('Correo de recuperación enviado.');
                    })
                    .catch((error) => {
                        console.error(error.message);
                        alert('Error al enviar el correo de recuperación: ' + error.message);
                    });
            }
        });
    </script>
</body>
</html>
